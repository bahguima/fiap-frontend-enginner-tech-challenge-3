# Template do nginx (imagem oficial): copiado para
# /etc/nginx/templates/default.conf.template e processado por envsubst na
# inicialização. Só variáveis de ambiente definidas são substituídas, então
# variáveis do nginx como $uri permanecem intactas.
#
# CSP_REMOTE_ORIGINS: origens dos remotes do Module Federation (remoteEntry.js
#   e chunks), separadas por espaço. Necessário no shell; vazio nos remotes.
# CSP_API_ORIGIN: origem da API REST quando diferente da origem da página.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança. Atenção: um add_header dentro de location
    # anula a herança destes; repita-os nesse caso.
    # - script-src: só a própria origem e os remotes (sem inline/eval).
    # - style-src 'unsafe-inline': styled-components e Radix injetam <style>.
    # - frame-ancestors 'none' + X-Frame-Options: impede clickjacking.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${CSP_REMOTE_ORIGINS}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ${CSP_REMOTE_ORIGINS} ${CSP_API_ORIGIN}; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Access-Control-Allow-Origin "*" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Entrada federada: sem cache e acessível ao shell (outra origem). Como
    # este bloco define add_header, os cabeçalhos aplicáveis a scripts são
    # repetidos (CSP/X-Frame-Options valem para documentos, não para JS).
    location = /remoteEntry.js {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
